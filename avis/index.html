<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Chicken Amine · Avis Google</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Cairo:wght@600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e1060f; color: #1d1d1d; font-family: "Poppins", "Cairo", sans-serif; padding: 20px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 22px; padding: 28px 24px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 40px -24px rgba(0,0,0,.6); }
    .card img { width: 220px; height: auto; margin: 0 auto 18px; display: block; }
    h1 { font-family: "Baloo 2", sans-serif; color: #e1060f; font-size: 1.7rem; margin: 0 0 8px; }
    p { margin: 0 0 6px; }
    [lang="ar"] { font-family: "Cairo", sans-serif; direction: rtl; }
    a.btn { display: inline-block; margin-top: 18px; background: #fbba00; color: #141414; font-weight: 700; text-decoration: none; padding: 12px 22px; border-radius: 999px; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/assets/logo.png" alt="Chicken Amine" width="640" height="332">
    <div id="coming-soon">
      <h1>Bientôt disponible</h1>
      <p>Les avis Google arrivent très bientôt. Merci de votre visite !</p>
      <p lang="ar">آراء Google قريبا. شكرا على زيارتكم!</p>
      <a class="btn" href="/">Voir le menu</a>
    </div>
  </main>
  <script src="/js/config.js"></script>
  <script>
    // Forwards to the Google review link once it is set in js/config.js.
    (function () {
      var url = window.CONFIG && window.CONFIG.googleReviewUrl;
      if (url) location.replace(url);
    })();
  </script>
</body>
</html>
